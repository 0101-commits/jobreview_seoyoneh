name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # eslint는 오류에서만 실패한다(경고는 exit 0). 지금 남은 경고는 react-refresh 계열뿐이라
      # 배포를 막지 않으면서 새로 들어오는 오류만 잡는다.
      - run: npm run lint
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      # BrowserRouter: GitHub Pages는 /jobs/:id 같은 경로에 파일이 없으면 404를 준다.
      # 404.html을 index.html 사본으로 두면 새로고침·직접 링크가 앱으로 들어온다.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
